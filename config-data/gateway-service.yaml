server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: car-service
          uri: lb://CAR-SERVICE
          predicates:
            - Path=/cars/**
        - id: motorbike-service
          uri: lb://MOTORBIKE-SERVICE
          predicates:
            - Path=/motorbikes/**
